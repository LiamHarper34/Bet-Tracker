name: Update prices and deploy

on:
  push:
    branches: [claude/sls-solana-bet-tracker-45h59u, main]
  schedule:
    - cron: "*/15 * * * *" # GitHub may delay scheduled runs at busy times
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prices
        run: |
          # Last deployed data, used as a fallback if a price source is down
          export PREVIOUS_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/data.json"
          node scripts/fetch-prices.mjs site/data.json
      - name: Price correlation (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/correlation.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
